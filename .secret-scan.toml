# secret-scan configuration for this repository.
#
# Every allow entry needs a reason. An undocumented suppression is
# indistinguishable from someone silencing a real leak.

fail_on = "medium"

exclude_paths = [
  "target/**",
]

# This repository's own test suite is full of credential-shaped strings. They
# are all fake, but they are deliberately realistic, which is the point.
[[allow]]
path = "tests/**"
reason = "test fixtures: deliberately realistic but fake credentials used to exercise the rules"

[[allow]]
path = "src/rules.rs"
reason = "the rule definitions contain example patterns and prefixes by necessity"

[[allow]]
path = "README.md"
reason = "documentation shows example findings, with fake credentials"

# The behaviour job plants a known-fake AWS key and GitHub token to prove the
# scanner catches them and that the hook blocks a commit. The AWS value is the
# one published in AWS's own documentation.
#
# Note: naming that key literally in this comment made the scanner flag this
# very file, which is correct -- the config is scanned like anything else.
[[allow]]
path = ".github/workflows/**"
reason = "CI plants deliberately fake credentials to verify detection end to end"
