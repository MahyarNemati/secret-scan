[package]
name = "secret-scan"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Finds leaked credentials in source trees and git history. Pre-commit hook and SARIF output."
license = "MIT"
repository = "https://github.com/MahyarNemati/secret-scan"

[[bin]]
name = "secret-scan"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
ignore = "0.4"            # .gitignore-aware parallel walker, from ripgrep
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
rayon = "1"
base64 = "0.22"
once_cell = "1"
termcolor = "1"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
